<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>摄像头 RTSP 配置</title>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f7fa;margin:0;padding:20px;color:#24324a}
    main{max-width:960px;margin:auto}.card{background:#fff;border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.row{margin:14px 0}
    label{display:block;margin-bottom:6px}select,input{width:100%;padding:9px;border:1px solid #ccd3dd;border-radius:5px}
    button{border:0;border-radius:5px;padding:10px 16px;background:#1688d4;color:#fff;cursor:pointer;margin-right:8px}.secondary{background:#637083}
    #rtspUrl{font-family:monospace;color:#075e9b;background:#edf8ff;padding:12px;border-radius:5px;word-break:break-all}
    #message{margin-top:12px;white-space:pre-wrap}.ok{color:#087c42}.error{color:#b42318}pre{white-space:pre-wrap;max-height:360px;overflow:auto;background:#f7f8fa;padding:12px}
  </style>
</head>
<body><main>
  <h1>摄像头 RTSP 配置</h1>
  <section class="card"><h2>播放地址</h2><div id="rtspUrl">rtsp://192.168.137.239:8554/live</div><br><button id="copyBtn">一键复制</button></section>
  <div class="grid">
    <section class="card"><h2>视频参数</h2>
      <form id="configForm">
        <div class="row"><label>分辨率</label><select name="resolution"><option value="640x480">640 × 480（默认）</option><option value="1280x720">1280 × 720</option><option value="1600x1200">1600 × 1200（板端最大）</option></select></div>
        <div class="row"><label>帧率（FPS）</label><input name="fps" type="number" min="1" max="30" value="25"></div>
        <div class="row"><label>码率（kbps）</label><input name="bitrate_kbps" type="number" min="128" max="8192" value="6000"></div>
        <div class="row"><label>编码格式</label><select name="codec"><option value="H264">H.264</option><option value="H265">H.265</option></select></div>
        <div class="row"><label>GOP</label><input name="gop" type="number" min="1" max="300" value="15"></div>
        <button type="submit">应用并重启视频</button><button type="button" class="secondary" id="runtimeBtn">仅应用帧率和码率</button>
      </form><div id="message"></div>
    </section>
    <section class="card"><h2>运行状态</h2><pre id="status">加载中…</pre><button id="refreshBtn">刷新状态</button></section>
  </div>
</main><script>
const $=s=>document.querySelector(s), form=$('#configForm'), message=$('#message');
function show(text,ok){message.textContent=text;message.className=ok?'ok':'error'}
async function copyUrl(){const text=$('#rtspUrl').textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}show('RTSP 地址已复制',true)}catch(e){show('复制失败：'+e.message,false)}}
function body(restart){const d=new URLSearchParams(new FormData(form));const [w,h]=d.get('resolution').split('x');d.delete('resolution');d.set('width',w);d.set('height',h);if(!restart){const r=new URLSearchParams();r.set('fps',d.get('fps'));r.set('bitrate_kbps',d.get('bitrate_kbps'));return r}return d}
async function apply(restart){show('正在应用…',true);try{const res=await fetch(restart?'/api/config/restart':'/api/config',{method:'POST',body:body(restart)});const data=await res.json();if(!res.ok||data.code!==0)throw new Error(`${data.message||'配置失败'} (code=${data.code}, stage=${data.stage||'none'}, hal=${data.hal_error||0})`);show(restart?'配置成功，视频链路已重启':'在线参数已生效',true);await refresh()}catch(e){show('配置失败：'+e.message,false)}}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();$('#status').textContent=JSON.stringify(d,null,2);$('#rtspUrl').textContent=(d.rtsp_url||`rtsp://${location.hostname}:8554/live`).replace('192.168.137.239',location.hostname);form.fps.value=d.fps;form.bitrate_kbps.value=d.bitrate_kbps;form.codec.value=d.codec;form.gop.value=d.gop;const option=[...form.resolution.options].find(o=>o.value===`${d.width}x${d.height}`);if(option)form.resolution.value=option.value}catch(e){show('读取状态失败：'+e.message,false)}}
form.addEventListener('submit',e=>{e.preventDefault();apply(true)});$('#runtimeBtn').onclick=()=>apply(false);$('#copyBtn').onclick=copyUrl;$('#refreshBtn').onclick=refresh;refresh();setInterval(refresh,3000);
</script></body></html>
