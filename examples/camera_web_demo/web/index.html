<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Web Demo</title>
  <style>
    body { margin: 0; background: #111827; color: #e5e7eb; font: 14px sans-serif; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 18px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
    .card { background: #1f2937; border-radius: 10px; padding: 16px; }
    canvas { width: 100%; height: auto; background: #000; display: block; }
    label { display: block; margin-top: 10px; color: #cbd5e1; }
    input, select, button { width: 100%; box-sizing: border-box; margin-top: 5px; padding: 8px; border: 1px solid #4b5563; border-radius: 5px; background: #111827; color: #f9fafb; }
    button { cursor: pointer; background: #2563eb; border: 0; margin-top: 16px; }
    button.secondary { background: #374151; }
    .status { line-height: 1.8; color: #93c5fd; white-space: pre-wrap; }
    .hint { color: #9ca3af; line-height: 1.6; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Camera Web Demo</h1>
  <div class="grid">
    <section class="card">
      <canvas id="video" width="1920" height="1080"></canvas>
      <p id="message" class="hint">正在连接视频流……</p>
      <button class="secondary" id="snapshot">抓取 JPEG</button>
    </section>
    <section class="card">
      <h2>视频配置</h2>
      <form id="config">
        <label>Sensor
          <input name="sensor_name" value="sc2356" readonly>
        </label>
        <label>Pipeline
          <input name="pipeline_name" value="video_record">
        </label>
        <label>视频通道
          <input name="channel" type="number" min="0" max="3" value="0">
        </label>
        <label>编码格式
          <select name="codec">
            <option value="H264" selected>H.264（浏览器支持较好）</option>
            <option value="H265">H.265（取决于浏览器和系统）</option>
          </select>
        </label>
        <label>宽度
          <input name="width" type="number" min="160" max="4096" value="1600">
        </label>
        <label>高度
          <input name="height" type="number" min="120" max="4096" value="1200">
        </label>
        <label>帧率
          <input name="fps" type="number" min="1" max="60" value="25">
        </label>
        <label>码率（kbps）
          <input name="bitrate_kbps" type="number" min="16" max="50000" value="2048">
        </label>
        <label>GOP
          <input name="gop" type="number" min="1" max="1000" value="60">
        </label>
        <label>RC mode
          <input name="rc_mode" type="number" min="0" max="3" value="2">
        </label>
        <label>Profile
          <input name="profile" type="number" min="0" max="3" value="2">
        </label>
        <label>Min QP
          <input name="min_qp" type="number" min="0" max="51" value="10">
        </label>
        <label>Max QP
          <input name="max_qp" type="number" min="0" max="51" value="51">
        </label>
        <label>VPSS NR
          <select name="vpss_nr"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>VPSS Sharpen
          <select name="vpss_sharpen"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>VPSS IE sharpen
          <select name="vpss_iesharp"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>VI Width (0 keeps sensor mode)
          <input name="vi_width" type="number" min="0" max="4096" value="0">
        </label>
        <label>VI Height (0 keeps sensor mode)
          <input name="vi_height" type="number" min="0" max="4096" value="0">
        </label>
        <label>VI FPS (0 keeps sensor mode)
          <input name="vi_fps" type="number" min="0" max="60" value="0">
        </label>
        <label>VI Bit Width (0 keeps sensor mode)
          <input name="vi_bit_width" type="number" min="0" max="16" value="0">
        </label>
        <label>VI WDR
          <select name="vi_wdr"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>VI NR
          <select name="vi_nr"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>VI Sharpen
          <select name="vi_sharpen"><option value="auto" selected>auto</option><option value="0">off</option><option value="1">on</option></select>
        </label>
        <label>默认配置文件
          <input name="default_config_path" value="configs/hal_default.json">
        </label>
        <label>运行配置文件
          <input name="runtime_config_path" value="configs/hal.json">
        </label>
        <label>用户配置文件
          <input name="user_config_path" placeholder="可选">
        </label>
        <button type="submit">应用配置并重启视频</button>
      </form>
      <p id="result" class="hint"></p>
      <h2>运行状态</h2>
      <div id="status" class="status">读取中……</div>
    </section>
  </div>
</main>
<script>
const canvas = document.getElementById('video');
const context = canvas.getContext('2d');
const message = document.getElementById('message');
const status = document.getElementById('status');
const configForm = document.getElementById('config');
let decoder = null;
let socket = null;

function selectedCodec() {
  return document.querySelector('[name=codec]').value;
}

function codecString(codec) {
  return codec === 'H265' ? 'hev1.1.6.L93.B0' : 'avc1.42E01E';
}

function hasKeyFrame(bytes, codec) {
  for (let index = 0; index + 4 < bytes.length; index += 1) {
    let offset = 0;
    if (bytes[index] === 0 && bytes[index + 1] === 0 && bytes[index + 2] === 1) offset = 3;
    if (bytes[index] === 0 && bytes[index + 1] === 0 && bytes[index + 2] === 0 && bytes[index + 3] === 1) offset = 4;
    if (!offset || index + offset >= bytes.length) continue;
    const type = codec === 'H265' ? ((bytes[index + offset] >> 1) & 0x3f) : (bytes[index + offset] & 0x1f);
    if ((codec === 'H264' && type === 5) || (codec === 'H265' && type >= 19 && type <= 21)) return true;
  }
  return false;
}

function closeDecoder() {
  if (decoder) {
    try { decoder.close(); } catch (_) {}
    decoder = null;
  }
}

function setFormValue(name, value) {
  const field = configForm.elements[name];
  if (!field || value === undefined || value === null || document.activeElement === field) {
    return;
  }
  field.value = String(value);
}

function syncFormFromStatus(value) {
  [
    'codec',
    'width',
    'height',
    'fps',
    'bitrate_kbps',
    'gop',
    'rc_mode',
    'profile',
    'min_qp',
    'max_qp',
    'vi_width',
    'vi_height',
    'vi_fps',
    'vi_bit_width'
  ].forEach(name => setFormValue(name, value[name]));
}

function resizeCanvasToFrame(frame) {
  const width = frame.displayWidth || frame.codedWidth || canvas.width;
  const height = frame.displayHeight || frame.codedHeight || canvas.height;
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
}

function connectStream() {
  if (!('VideoDecoder' in window)) {
    message.textContent = '当前浏览器不支持 WebCodecs，请使用较新的 Chromium 浏览器。';
    return;
  }
  if (socket) socket.close();
  closeDecoder();
  const codec = selectedCodec();
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => { message.textContent = `WebSocket 已连接，等待 ${codec} 关键帧……`; };
  socket.onclose = () => { message.textContent = 'WebSocket 已断开'; };
  socket.onerror = () => { message.textContent = 'WebSocket 连接失败'; };
  socket.onmessage = event => {
    const bytes = new Uint8Array(event.data);
    if (!decoder) {
      decoder = new VideoDecoder({
        output: frame => {
          resizeCanvasToFrame(frame);
          context.drawImage(frame, 0, 0, canvas.width, canvas.height);
          frame.close();
        },
        error: error => { message.textContent = `视频解码失败：${error.message}`; closeDecoder(); }
      });
      decoder.configure({ codec: codecString(codec), optimizeForLatency: true });
    }
    try {
      decoder.decode(new EncodedVideoChunk({
        type: hasKeyFrame(bytes, codec) ? 'key' : 'delta',
        timestamp: performance.now() * 1000,
        data: bytes
      }));
      message.textContent = `WebSocket 已连接，编码格式：${codec}`;
    } catch (error) {
      message.textContent = `视频帧提交失败：${error.message}`;
    }
  };
}

async function refreshStatus() {
  try {
    const response = await fetch('/api/status');
    const value = await response.json();
    syncFormFromStatus(value);
    status.textContent = JSON.stringify(value, null, 2);
  } catch (error) {
    status.textContent = `状态读取失败：${error.message}`;
  }
}

configForm.addEventListener('submit', async event => {
  event.preventDefault();
  const body = new URLSearchParams(new FormData(event.target));
  const response = await fetch('/api/config', { method: 'POST', body });
  const result = await response.json();
  document.getElementById('result').textContent =
    result.code === 0 ? result.message : JSON.stringify(result, null, 2);
  if (result.code === 0) {
    connectStream();
    refreshStatus();
  }
});

document.getElementById('snapshot').addEventListener('click', () => {
  window.open('/snapshot.jpg', '_blank');
});

connectStream();
refreshStatus();
setInterval(refreshStatus, 1000);
</script>
</body>
</html>
