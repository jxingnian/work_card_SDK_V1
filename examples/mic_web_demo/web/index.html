<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦克风测试</title><style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fa;color:#18202b}body{margin:0;padding:24px}main{max-width:860px;margin:auto}section{background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:6px;padding:10px 14px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}button.secondary{background:#475569}button.danger{background:#dc2626}button:disabled{opacity:.55;cursor:not-allowed}input,select{height:38px;padding:0 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px}input{width:84px}audio{width:100%;margin-top:14px}pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;padding:12px;border-radius:6px;min-height:120px;overflow:auto}.label{color:#475569}.timer{font-size:22px;font-variant-numeric:tabular-nums;min-width:90px;color:#b91c1c}</style></head><body><main>
<h1>麦克风测试</h1><section><h2>固定时长录音</h2><div class="row"><span class="label">录音时长</span><input id="seconds" value="30" inputmode="numeric"><span class="label">秒</span><select id="format"><option value="pcm">PCM/WAV</option><option value="opus">OPUS/OGG</option></select><button id="recordBtn">录音并播放</button></div><audio id="player" controls></audio></section>
<section><h2>长时间录音测试</h2><div class="row"><select id="longFormat"><option value="pcm">PCM/WAV</option><option value="opus">OPUS/OGG</option></select><button id="longStartBtn">开始持续录音</button><button id="longStopBtn" class="danger" disabled>停止并保存</button><button id="longDownloadBtn" class="secondary" disabled>下载保存的录音</button><span id="longTimer" class="timer">00:00:00</span></div><p class="label">点击开始后持续采集，点击停止结束并保存；停止后可下载完整文件。</p></section>
<section><h2>扬声器</h2><div class="row"><button id="speakerBtn">播放人声测试音</button><button class="secondary" id="stopSpeakerBtn">停止播放</button><button class="secondary" id="volumeBtn">设置音量 100</button><button class="secondary" id="statusBtn">状态</button><button class="danger" id="clearBtn">清空日志</button></div></section><section><pre id="log"></pre></section></main><script>
const $=id=>document.getElementById(id);let longStartedAt=0,timerId=0;function log(m){$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`;$('log').scrollTop=$('log').scrollHeight}async function api(p){const r=await fetch(p),t=r.headers.get('content-type')||'';if(!r.ok)throw Error((await r.text())||`HTTP ${r.status}`);return t.includes('application/json')?r.json():r.blob()}function updateTimer(){const s=Math.floor((Date.now()-longStartedAt)/1000);$('longTimer').textContent=[s/3600|0,s/60%60|0,s%60].map(v=>String(v).padStart(2,'0')).join(':')}
$('recordBtn').onclick=async()=>{const s=Math.max(1,Math.min(30,parseInt($('seconds').value||30,10))),f=$('format').value;$('seconds').value=s;$('recordBtn').disabled=true;try{log(`开始固定录音 ${s}s`);const b=await api(`/api/record?seconds=${s}&format=${f}`);$('player').src=URL.createObjectURL(b);log(`完成：${b.size} 字节`)}catch(e){log(`失败：${e.message}`)}finally{$('recordBtn').disabled=false}};
$('longStartBtn').onclick=async()=>{try{const r=await api(`/api/long_record/start?format=${$('longFormat').value}`);longStartedAt=Date.now();timerId=setInterval(updateTimer,250);$('longStartBtn').disabled=true;$('longStopBtn').disabled=false;$('longDownloadBtn').disabled=true;log(`持续录音已开始（${r.format}）`)}catch(e){log(`开始失败：${e.message}`)}};$('longStopBtn').onclick=async()=>{try{const r=await api('/api/long_record/stop');clearInterval(timerId);updateTimer();$('longStartBtn').disabled=false;$('longStopBtn').disabled=true;$('longDownloadBtn').disabled=false;log(`持续录音已保存：${r.duration_ms} ms，${r.bytes} 字节，${r.frames} 帧`)}catch(e){log(`停止失败：${e.message}`)}};$('longDownloadBtn').onclick=()=>{window.location='/api/long_record/download';log('已开始下载保存的长录音')};
$('speakerBtn').onclick=async()=>{try{log(JSON.stringify(await api('/api/play')))}catch(e){log(`播放失败：${e.message}`)}};$('stopSpeakerBtn').onclick=async()=>{try{log(JSON.stringify(await api('/api/stop')))}catch(e){log(`停止失败：${e.message}`)}};$('volumeBtn').onclick=async()=>{try{log(JSON.stringify(await api('/api/volume?value=100')))}catch(e){log(`音量失败：${e.message}`)}};$('statusBtn').onclick=async()=>{try{log(JSON.stringify(await api('/api/status')))}catch(e){log(`状态失败：${e.message}`)}};$('clearBtn').onclick=()=>{$('log').textContent='';$('player').removeAttribute('src')};api('/api/status').then(d=>log(JSON.stringify(d))).catch(e=>log(e.message));</script></body></html>
