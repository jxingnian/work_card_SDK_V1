<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mic Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #18202b;
    }
    body { margin: 0; padding: 24px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 18px; }
    section {
      background: #fff;
      border: 1px solid #d9e0e8;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input, select {
      height: 38px;
      padding: 0 9px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      background: #fff;
    }
    input { width: 84px; }
    audio { width: 100%; margin-top: 14px; }
    pre {
      white-space: pre-wrap;
      background: #0f172a;
      color: #dbeafe;
      padding: 12px;
      border-radius: 6px;
      min-height: 120px;
      overflow: auto;
    }
    .label { color: #475569; }
  </style>
</head>
<body>
<main>
  <h1>麦克风测试</h1>
  <section>
    <div class="row">
      <span class="label">录音时长</span>
      <input id="seconds" value="5" inputmode="numeric">
      <span class="label">秒</span>
      <span class="label">格式</span>
      <select id="format">
        <option value="pcm">PCM/WAV</option>
        <option value="opus">OPUS/OGG</option>
      </select>
      <button id="recordBtn">录音并播放</button>
      <button class="secondary" id="statusBtn">状态</button>
      <button class="danger" id="clearBtn">清空</button>
    </div>
    <audio id="player" controls></audio>
  </section>
  <section>
    <pre id="log"></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

function log(message) {
  const now = new Date().toLocaleTimeString();
  $('log').textContent += `[${now}] ${message}\n`;
  $('log').scrollTop = $('log').scrollHeight;
}

async function api(path) {
  const res = await fetch(path);
  const type = res.headers.get('content-type') || '';
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || `HTTP ${res.status}`);
  }
  if (type.includes('application/json')) {
    return res.json();
  }
  return res.blob();
}

$('recordBtn').onclick = async () => {
  const seconds = Math.max(1, Math.min(30, parseInt($('seconds').value || '5', 10)));
  const format = $('format').value;
  $('seconds').value = String(seconds);
  $('recordBtn').disabled = true;
  try {
    log(`开始录音 ${seconds}s，格式 ${format.toUpperCase()}`);
    const blob = await api(`/api/record?seconds=${seconds}&format=${format}`);
    const url = URL.createObjectURL(blob);
    $('player').src = url;
    await $('player').play();
    log(`录音完成，${blob.type || 'audio'} ${blob.size} 字节`);
  } catch (err) {
    log(`失败：${err.message}`);
  } finally {
    $('recordBtn').disabled = false;
  }
};

$('statusBtn').onclick = async () => {
  try {
    const data = await api('/api/status');
    log(JSON.stringify(data));
  } catch (err) {
    log(`状态失败：${err.message}`);
  }
};

$('clearBtn').onclick = () => {
  $('log').textContent = '';
  $('player').removeAttribute('src');
};

api('/api/status').then((data) => log(JSON.stringify(data))).catch((err) => log(err.message));
</script>
</body>
</html>
