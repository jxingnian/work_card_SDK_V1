<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMU 实时姿态</title>
<style>body{margin:0;background:#0b1220;color:#e5eefc;font:15px system-ui, sans-serif}main{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#131f33;border:1px solid #263c5d;border-radius:14px;padding:16px}.values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v{background:#0d1728;padding:12px;border-radius:9px;text-align:center}.v b{display:block;font-size:22px;color:#6ee7ff}canvas{width:100%;height:330px;background:#07101d;border-radius:12px}button{background:#20c997;color:#04131a;border:0;padding:10px 16px;border-radius:8px;font-weight:700}.muted{color:#9bb0cc}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<main><h1>QMI8658C IMU 实时验证</h1><p class="muted">每 100 ms 读取一次 I2C1 数据；球体方向由加速度计算，箭头显示重力方向。</p><div class="grid"><section class="card"><h2>姿态可视化</h2><canvas id="view" width="700" height="330"></canvas><p id="state" class="muted">连接中…</p><button id="wom">启用移动唤醒</button></section><section class="card"><h2>实时数据</h2><h3>加速度（原始 LSB）</h3><div class="values"><div class="v">X<b id="ax">-</b></div><div class="v">Y<b id="ay">-</b></div><div class="v">Z<b id="az">-</b></div></div><h3>角速度（原始 LSB）</h3><div class="values"><div class="v">X<b id="gx">-</b></div><div class="v">Y<b id="gy">-</b></div><div class="v">Z<b id="gz">-</b></div></div><p>温度：<b id="temp">-</b>　STATUS0：<b id="s0">-</b>　STATUS1：<b id="s1">-</b></p></section></div></main>
<script>const $=id=>document.getElementById(id),c=$('view'),x=c.getContext('2d');function draw(a){x.clearRect(0,0,c.width,c.height);let z=Math.max(70,Math.min(140,110+Math.abs(a.z)/500));let roll=Math.atan2(a.y,Math.abs(a.z)),pitch=Math.atan2(a.x,Math.abs(a.z));x.save();x.translate(c.width/2,c.height/2);x.rotate(roll);x.fillStyle='#20c997';x.beginPath();x.ellipse(0,0,z,z*.62,0,0,Math.PI*2);x.fill();x.strokeStyle='#b8fff0';x.lineWidth=4;x.stroke();x.fillStyle='#07101d';x.font='bold 24px system-ui';x.textAlign='center';x.fillText('IMU',0,8);x.restore();x.strokeStyle='#ffcf5a';x.lineWidth=6;x.beginPath();x.moveTo(c.width/2,c.height/2);x.lineTo(c.width/2+a.x/35,c.height/2-a.y/35);x.stroke()}async function tick(){try{let r=await fetch('/api/data');let d=await r.json();if(!d.ok)throw Error();for(let k of ['ax','ay','az','gx','gy','gz'])$(k).textContent=d[k[0]=='a'?'accel':'gyro'][k[1]];$('temp').textContent=d.temperature;$('s0').textContent=d.status0;$('s1').textContent=d.status1;$('state').textContent='数据正常 · '+new Date().toLocaleTimeString();draw({x:d.accel.x,y:d.accel.y,z:d.accel.z})}catch(e){$('state').textContent='读取失败：检查 QMI8658C 与 /dev/i2c-1'}}setInterval(tick,100);tick();$('wom').onclick=async()=>{let r=await fetch('/api/wom',{method:'POST'});$('state').textContent=(await r.json()).ok?'已启用 INT1 移动唤醒':'移动唤醒配置失败'};</script>
